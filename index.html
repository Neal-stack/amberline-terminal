<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://finnhub.io wss://ws.finnhub.io https://api.twelvedata.com http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- page:start -->
<title>Amberline Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A browser-based, multi-panel market terminal with a command line, charts and news for real US stocks and ETFs, using your own Finnhub key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/terminal.css?v=9">
<!-- head:end -->
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><span class="word">Amberline</span><span class="sub">Terminal</span></div>
    <div class="feed" id="feed" data-state="poll"><span class="dot" aria-hidden="true"></span><span>Connecting</span></div>
    <div class="clocks">
      <span><span id="clockPrefix">New York</span> <b id="simClock">--:--</b> ET</span>
      <span id="mktState" class="state closed">Checking</span>
      <span id="dateLbl"></span>
    </div>
  </header>

  <div class="cmdwrap">
    <div class="cmdrow">
      <label for="cmd" class="prompt"><span id="promptPanel">1</span>&gt;</label>
      <div class="cmdbox">
        <input id="cmd" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest"
          placeholder="Type a ticker and a function, then press Enter.">
        <ul id="suggest" class="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
      <button class="go" id="goBtn" type="button">GO</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p class="banner" id="banner" hidden></p>
  </div>

  <main class="grid" id="grid" aria-label="Panels"></main>

  <nav class="fkeys" id="fkeys" aria-label="Function keys">
    <span class="disclaim" id="disclaim"></span>
  </nav>
  <footer class="tape" aria-label="Ticker tape"><div class="tape-track" id="tape"></div></footer>
</div>
<noscript><p style="padding:16px">Amberline Terminal needs JavaScript to run.</p></noscript>
<script src="src/finnhub.js?v=9"></script>
<script src="src/astral.js?v=9"></script>
<script src="src/history.js?v=9"></script>
<script src="src/market.js?v=9"></script>
<script src="src/terminal.js?v=9"></script>
<!-- page:end -->
</body>
</html>
